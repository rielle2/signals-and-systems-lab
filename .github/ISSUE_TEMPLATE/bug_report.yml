name: 问题反馈 / 数学纠错
description: 报告波形、公式、计算、习题或页面显示问题。
title: "[反馈] "
body:
  - type: markdown
    attributes:
      value: |
        感谢参与 SignalLab Beta 测试。此表单会创建公开的 GitHub Issue。
        请仅填写复现问题所需的信息，不要上传学习记录备份、令牌、密码、个人文件或其他人的资料。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 哪个知识点、实验、题目或页面出现了问题？数学纠错请说明使用的符号约定。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开哪个页面
        2. 输入哪个可公开的表达式、参数或选项
        3. 点击哪个按钮，观察到什么
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      description: 数学结果请尽量给出计算依据、适用条件或可公开的参考资料。
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 可附不包含隐私的截图或错误提示；请勿上传完整的浏览器存储导出。
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备与系统
      placeholder: 例如：Windows 11 电脑 / iPadOS 平板 / Android 手机
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: 浏览器及版本
      placeholder: 例如：Edge 版本号 / Safari 版本号
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 页面显示的版本（可选）
      placeholder: 可从 Beta 标记或项目说明中复制
    validations:
      required: false
  - type: input
    id: route
    attributes:
      label: 页面路由（可选）
      description: 只需地址中的 # 后部分；不要包含个人路径或敏感查询参数。
      placeholder: "例如：#labs/convolution?mode=custom"
    validations:
      required: false
  - type: textarea
    id: expression
    attributes:
      label: 可公开的表达式与计算窗口（可选）
      placeholder: 信号表达式、CT/DT 类型、积分窗口、网格数与参数
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: 公开提交检查
      options:
        - label: 我已检查反馈内容，确认未包含令牌、密码、个人隐私、学习记录备份或他人资料。
          required: true
