<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="信号与系统交互式学习平台：原创课程、六个数学实验室、习题与离线复习。">
  <title>SignalLab · 信号与系统</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/signal-tools.css">
  <link rel="stylesheet" href="css/beta.css">
  <script defer src="vendor/katex/katex.min.js"></script>
  <script defer src="vendor/katex/auto-render.min.js"></script>
  <script defer src="js/curriculum.js"></script>
  <script defer src="js/questions.js"></script>
  <script defer src="js/concept-visuals.js"></script>
  <script defer src="js/labs.js"></script>
  <script defer src="js/signal-engine.js"></script>
  <script defer src="js/signal-ui.js"></script>
  <script defer src="js/custom-labs.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="js/beta.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <aside id="sidebar" class="sidebar" aria-label="主导航"></aside>
  <div class="mobile-scrim" id="scrim"></div>
  <div class="app-shell">
    <header class="topbar">
      <button class="icon-btn mobile-toggle" id="menuToggle" aria-label="打开导航" aria-expanded="false">☰</button>
      <div id="breadcrumb" class="breadcrumb">学习空间 <span>/</span> 学习概览</div>
      <div class="topbar-actions">
        <button id="searchOpen" class="search-trigger" aria-label="搜索知识点和习题"><span>⌕</span> 搜索知识点、公式… <kbd>/</kbd></button>
        <button id="themeToggle" class="icon-btn" aria-label="切换深色模式">☾</button>
      </div>
    </header>
    <div id="storageWarning" class="storage-warning" hidden>浏览器未允许本地保存。本次学习仍可继续，请使用“数据备份”导出记录。</div>
    <main id="main" tabindex="-1"></main>
    <footer class="page-footer"><span>SignalLab · 让抽象的信号，变得看得见。</span><a href="#about">符号约定与项目说明 ↗</a></footer>
  </div>
  <dialog id="searchDialog" aria-labelledby="searchTitle">
    <div class="dialog-head"><h2 id="searchTitle">搜索学习内容</h2><button class="icon-btn" data-close-search aria-label="关闭搜索">×</button></div>
    <label class="sr-only" for="searchInput">知识点、公式或题目关键词</label>
    <input id="searchInput" class="search-input" type="search" placeholder="试试：卷积、收敛域、时不变…" autocomplete="off">
    <div id="searchResults" class="search-results"></div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript>本平台需要启用 JavaScript；启用后可完全离线使用。</noscript>
</body>
</html>
